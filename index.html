<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dice" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
</head>
<div id="app">
  <!-- 3D Canvas Container (Full Screen) -->
  <div id="dice-canvas"></div>

  <!-- Top bar theme switcher and clear button -->
    <header class="hud-top">
      <button type="button" id="dice-drawer-btn" class="hud-btn-secondary dice-bag-btn">
        <span id="active-dice-dot" class="swatch-dot" style="background: #991b1b;"></span>
        <span id="active-dice-name">Crimson</span>
      </button>

      <div style="display: flex; gap: 8px; align-items: center;">
        <button type="button" id="presets-drawer-btn" class="hud-btn-secondary dice-bag-btn">Presets</button>
      </div>
    </header>

    <!-- Shared Backdrop for Both Drawers -->
    <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>

    <!-- Left Slide-Out Dice Drawer -->
    <aside id="dice-drawer" class="dice-drawer">
      <div class="drawer-header">
        <h2>Dice Bag</h2>
        <button type="button" id="close-drawer-btn" class="icon-btn">&times;</button>
      </div>
      <div id="dice-list" class="dice-list"></div>
      <button type="button" id="parole-all-btn" class="parole-all-btn hidden">
        <img src="/public/unlock-red.svg" width="14" height="14" alt="" />
        <span>Parole All Dice</span>
      </button>
    </aside>

    <!-- Right Slide-Out Presets Drawer -->
    <aside id="presets-drawer" class="presets-drawer">
      <div class="drawer-header">
        <h2>Saved Rolls</h2>
        <button type="button" id="close-presets-btn" class="icon-btn">&times;</button>
      </div>

      <button type="button" id="add-preset-btn" class="preset-add-btn">+ New Preset</button>
      <div id="presets-list" class="presets-list"></div>
    </aside>

  <!-- Center-Top Result Banner (Hidden until roll finishes) -->
  <div id="result-banner" class="hud-result hidden">
    <div id="result-total">20</div>
    <div id="result-breakdown">d20: 20</div>
    <button type="button" id="jail-dice-btn" class="jail-btn" title="Banish this dice set to Dice Jail!" style="display: inline-flex; align-items: center; gap: 6px;">
      <img src="/public/lock-red.svg" width="14" height="14" alt="" />
      <span>Jail These Dice</span>
    </button>
  </div>

  <!-- Full-Screen Iron Bars Animation Overlay -->
  <div id="jail-overlay" class="jail-overlay hidden">
    <div class="jail-bars"></div>
    <div class="jail-stamp">DICE JAILED!</div>
  </div>

  <!-- Simple Pop-up Modal to Create a New Preset -->
  <div id="preset-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>New Roll Preset</h3>
      <input id="preset-name" type="text" placeholder="Name (e.g. Greatsword, Fireball)" />
      <input id="preset-formula" type="text" placeholder="Formula (e.g. 2d6+5 or 1d20+7)" />
      
      <!-- Pick which dice theme this preset uses! -->
      <select id="preset-theme">
        <option value="active">Use Currently Selected Dice</option>
      </select>

      <div class="modal-actions">
        <button type="button" id="cancel-preset-btn" class="hud-btn-secondary">Cancel</button>
        <button type="button" id="save-preset-btn" class="roll-action-btn" style="height: 42px; font-size: 0.95rem;">Save</button>
      </div>
    </div>
  </div>
    
  </div>
  <!-- Bottom Dock: Tap Dice to Build Pool -->
  <footer class="hud-bottom">
    <div class="dice-dock">
      <!-- The hidden zero is the counter for how many dice to roll -->
      <button type="button" class="die-btn" data-sides="4">d4<span class="badge hidden">0</span></button>
      <button type="button" class="die-btn" data-sides="6">d6<span class="badge hidden">0</span></button>
      <button type="button" class="die-btn" data-sides="8">d8<span class="badge hidden">0</span></button>
      <button type="button" class="die-btn" data-sides="10">d10<span class="badge hidden">0</span></button>
      <button type="button" class="die-btn" data-sides="12">d12<span class="badge hidden">0</span></button>
      <button type="button" class="die-btn" data-sides="20">d20<span class="badge hidden">0</span></button>
      <button type="button" class="die-btn" data-sides="100">d100<span class="badge hidden">0</span></button>
    </div>
    <button type="button" id="roll-btn" class="roll-action-btn">ROLL</button>
    <button type="button" id="clear-btn" class="clear-action-btn" style="display: flex; align-items: center; gap: 6px;">
      <img src="/public/trash-can-white.svg" width="20" height="20" alt="" />
      <span>Clear</span>
    </button>
  </footer>

<script type="module" src="/src/main.js"></script>
